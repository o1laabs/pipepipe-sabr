<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ece3da">
<title>Geex · Arts Mentor App</title>
<link rel="stylesheet" href="/style.css?v=9">
</head>
<body>
<div class="app">
  <header class="brand"><b>Geex</b><span>Arts Mentor App</span></header>
  <main class="feed" id="feed" aria-busy="true">
    <section class="chapter"><div class="word">Save</div>
      <div class="cards"><div class="skel"></div></div></section>
    <section class="chapter"><div class="word">Best Video</div>
      <div class="cards"><div class="skel"></div></div></section>
  </main>
</div>

<section class="player" id="player" aria-hidden="true">
  <div class="top">
    <button class="icon-btn" id="close" aria-label="返回">‹</button>
    <div class="sub" style="margin:0"><i id="pAv">·</i><span id="pAuthor">—</span></div>
  </div>
  <h2 id="pTitle">—</h2>
  <div class="stage"><video id="pv" playsinline preload="metadata"></video></div>
  <div class="controls">
    <div class="times"><span id="tCur">00:00</span><span id="tDur">00:00</span></div>
    <div class="scrub" id="scrub">
      <div class="track"></div><div class="fill" id="fill"></div><div class="dot" id="dot"></div>
    </div>
    <div class="row">
      <button class="pill" id="toggle">
        <svg viewBox="0 0 10 12" id="icoPlay"><path d="M0 0l10 6-10 6z"/></svg>
        <span id="toggleText">Play</span>
      </button>
      <button class="act" id="like">
        <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9a3.8 3.8 0 017-2.1A3.8 3.8 0 0119 11c0 4.6-7 9-7 9z"/></svg>
        <span id="likeN">0</span>
      </button>
      <div class="grow"></div>
      <select class="quality" id="quality" aria-label="清晰度"></select>
      <button class="act save" id="save" aria-label="保存">
        <svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 011 1v15l-6-4-6 4V5a1 1 0 011-1z"/></svg>
      </button>
    </div>
  </div>
</section>

<div class="state" id="state" hidden>
  <div class="box">
    <h3 id="stTitle">加载失败</h3>
    <p id="stBody">网络或上游暂时不可用。</p>
    <button id="stRetry">重试</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="/app.js?v=9"></script>
</body>
</html>
